<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUST WORK · FUA Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app" data-mode="just-working">

    <!-- ============ LEFT RAIL : logo + mode switcher ============ -->
    <aside class="rail">
      <div class="rail-logo" title="JUST WORK · FUA Studio">
        <img id="railLogo" src="../assets/logo/logo.svg" alt="JUST WORK" />
      </div>
      <div class="rail-modes" role="tablist" aria-label="工作模式">
        <button class="mode-btn" data-mode="just-working" title="Just Working · 日常">
          <span class="mode-ic">☀</span><span class="mode-tl">Just</span>
        </button>
        <button class="mode-btn" data-mode="agent" title="Agent · 技术 / Coding">
          <span class="mode-ic">⌗</span><span class="mode-tl">Agent</span>
        </button>
        <button class="mode-btn" data-mode="urgent" title="Urgent · 快 & 省">
          <span class="mode-ic">⚡</span><span class="mode-tl">Urgent</span>
        </button>
      </div>
      <div class="rail-foot">
        <div class="studio">FUA<br>STUDIO</div>
      </div>
    </aside>

    <!-- ============ MAIN STAGE ============ -->
    <main class="stage">
      <!-- top bar -->
      <header class="topbar">
        <div class="topbar-brand">
          <span class="brand-mark">JUST WORK</span>
          <span class="brand-mode" id="brandMode">Just Working</span>
        </div>
        <div class="topbar-tools">
          <div class="search" id="searchBox">
            <input id="searchInput" type="search" placeholder="搜索 skill / 模块…" autocomplete="off" />
            <span class="search-ic">⌕</span>
          </div>
          <span class="count-chip" id="countChip">0 skills</span>
          <span class="urg-switch" id="urgSwitch" title="Agent ⇄ Urgent 快省模式" hidden>
            <span class="us-lbl">Urgent</span>
            <span class="us-track"><span class="us-knob"></span></span>
          </span>
        </div>
      </header>

      <!-- hero / module grid -->
      <section class="hero" id="hero">
        <div class="hero-title" id="heroTitle">今天，一件一件把它做完。</div>
        <div class="hero-sub" id="heroSub">点一个模块，直接开干。</div>
      </section>

      <!-- module grid (one-click entry) -->
      <section class="grid" id="grid" role="list"></section>

      <!-- empty / no-search state -->
      <section class="empty" id="empty" hidden>
        <div class="empty-ic">∅</div>
        <div class="empty-tl">没有找到匹配的 skill</div>
        <div class="empty-sub">换个关键词，或切换模式试试。</div>
      </section>
    </main>

    <!-- ============ WORKSPACE DRAWER (detail) ============ -->
    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <button class="drawer-close" id="drawerClose" aria-label="返回">←</button>
        <div class="drawer-id">
          <div class="drawer-cat" id="drawerCat">模块</div>
          <div class="drawer-name" id="drawerName">Skill</div>
          <div class="drawer-desc" id="drawerDesc"></div>
        </div>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-out" id="drawerOut" hidden>
        <div class="out-bar">
          <span class="out-tl">输出</span>
          <div class="out-acts">
            <button id="copyBtn" class="out-btn">复制</button>
            <button id="dlBtn" class="out-btn">保存</button>
          </div>
        </div>
        <pre class="out-pre" id="outPre"></pre>
      </div>
      <div class="drawer-foot">
        <button id="runBtn" class="run-btn">生成</button>
        <button id="clearBtn" class="ghost-btn">清空</button>
      </div>
    </aside>

    <!-- toast -->
    <div class="toast" id="toast" hidden></div>

    <footer class="foot">
      <span class="foot-studio" id="footVer">© 2026 FUA Studio · JUST WORK v1.0.0</span>
      <span class="foot-note">本地运行 · 无需联网</span>
    </footer>
  </div>

  <script src="logic.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
